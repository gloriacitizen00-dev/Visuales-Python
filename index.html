<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Visuales con Python</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    body{
      font-family:system-ui,sans-serif;
      background:linear-gradient(135deg,#fdfbfb,#ebedee);
      color:#222;
      min-height:100vh;
    }

    /* BOTÓN VOLVER */
   .back-btn{
  position:fixed;
  top:20px;
  right:20px;
  padding:10px 16px;
  background:#6a5acd;
  color:white;
  text-decoration:none;
  border-radius:20px;
  font-size:.9rem;
  box-shadow:0 8px 20px rgba(0,0,0,.3);
  transition:.25s;
  z-index:9999;
  pointer-events:auto;  
    }

    .back-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 12px 26px rgba(0,0,0,.25);
    }

    /* CONTENIDO */
    main{
      max-width:1100px;
      margin:auto;
      padding:100px 20px;
      text-align:center;
    }

    h1{
      font-size:2.6rem;
      margin-bottom:20px;
      color:#6a5acd;
    }

    p{
      font-size:1.1rem;
      opacity:.8;
      margin-bottom:40px;
    }

    /* IMAGEN */
    .visual-img{
      max-width:45%;
      border-radius:18px;
      box-shadow:0 18px 40px rgba(0,0,0,.25);
    }
  </style>
</head>

<body>

  <!-- BOTÓN VOLVER -->
  <a href="https://gloriacitizen00-dev.github.io//Portafolio/" class="back-btn">
  ← Volver al portafolio
</a>

  <main>
    <h1>Visuales con Python</h1>
    <p>Exploraciones visuales generadas con código y datos.
     Este visual fue generado mediante código en Python.<br>
  La animación existe como proceso computacional y debe ejecutarse localmente.</p>

    <p>
  🔗 <a href="https://github.com/gloriacitizen00-dev/Visuales-Python" target="_blank" rel="noopener">
  Ver código y ejecutar instrucciones en GitHub
  </a>
</p>
    
    <img src="fireworks-portada.PNG" alt="Visual generado con Python" class="visual-img">
  </main>

</body>
</html>
